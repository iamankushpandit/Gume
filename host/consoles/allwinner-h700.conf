# Any console built on the Allwinner H700 that has no profile of its own.
#
# NOT TESTED ON A CONSOLE. It is what the image falls back to on a member of
# the family it has not been taught, and it claims only the buttons the
# family's shared joypad mapping names. It claims no stick: a stick input
# that is not wired to a stick reads whatever it likes, and a crosshair
# wandering across the screen by itself is worse than no crosshair. So a
# console running on this profile has no way onto the board games' boards
# until it has a profile that says where its stick is.
#
# `match` is the family's own string, which every H700 console lists after
# its own. A console's own profile is found first.

name = Allwinner H700 console (no profile of its own)
match = allwinner,sun50i-h700
controls = dpad a b x y l1 r1 l2 r2 select start menu
