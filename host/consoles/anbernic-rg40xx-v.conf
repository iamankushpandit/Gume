# Anbernic RG40XX V.
#
# `match` is the first string of the console's device-tree `compatible`, as
# rocknix/dts/sun50i-h700-anbernic-rg40xx-v.dts gives it (the capital V is
# theirs). The second panel revision boots a different device tree and keeps
# the same `compatible`, so this one profile is for both.
#
# `controls` is what the console has: every button, and ONE stick, the left.
# The joypad driver reads four stick axes (`amux-count = <4>` in the device
# tree), but the bottom right of the face is a speaker, not a second stick,
# so the right stick's two axes have nothing wired to them. Listed, they
# would be given a job -- the battery on the light ring -- that no finger can
# do, and the stick's floating input would do it on its own. Played on the
# maintainer's own unit.

name = Anbernic RG40XX V
match = anbernic,rg40xx-V
controls = dpad a b x y l1 r1 l2 r2 select start menu lstick l3
