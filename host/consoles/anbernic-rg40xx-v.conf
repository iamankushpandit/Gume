# Anbernic RG40XX V.
#
# `match` is the first string of the console's device-tree `compatible`, as
# rocknix/dts/sun50i-h700-anbernic-rg40xx-v.dts gives it (the capital V is
# theirs). The second panel revision boots a different device tree and keeps
# the same `compatible`, so this one profile is for both.
#
# `controls` is what the kernel's joypad driver reports on this console:
# every button, and four stick axes. Played on the maintainer's own unit.

name = Anbernic RG40XX V
match = anbernic,rg40xx-V
controls = dpad a b x y l1 r1 l2 r2 select start menu lstick l3 rstick r3
