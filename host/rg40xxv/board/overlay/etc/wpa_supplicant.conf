# Braino's wpa_supplicant knows no network of its own. Braino hands it the one
# the owner joined, from its own sealed settings, on every start, and nothing
# is ever saved here: without update_config, wpa_supplicant cannot write this
# file even if asked.
#
# This file replaces Buildroot's, which ends in a network block with
# key_mgmt=NONE and no name -- an instruction to join any open network in
# range. Braino strips such a block before it starts wpa_supplicant
# (scrubSavedNetworks() in host/src/HostWifiOs.cpp), but the image should not
# depend on that; board/post-build.sh fails the build if one is here.
ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=0
