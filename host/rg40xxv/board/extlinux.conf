# cma=64M: a television on HDMI is driven from two frame buffers of up to
# 1920x1080 (16 MB; host/src/HostTvMode.h), beside the panel's and the
# kernel's own fbdev buffer for whatever was plugged in at boot, and every
# one of them has to be physically contiguous. The kernel's default of 32 MB
# leaves too little once the codec and the SD and Wi-Fi drivers have theirs;
# the console has 1 GB.
label braino
	kernel /Image
	fdt /sun50i-h700-anbernic-rg40xx-v.dtb
	append console=ttyS0,115200 quiet loglevel=0 rootwait cma=64M
