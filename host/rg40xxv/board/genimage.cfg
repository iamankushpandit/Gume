# The card: U-Boot at 8 KB where the H700's boot ROM looks for it, a FAT
# partition with the kernel (the whole system is built into it) and the
# device trees, and a small ext4 partition for Braino's settings and scores.

image boot.vfat {
	vfat {
		label = "BRAINO"
		files = {
			"Image",
			"sun50i-h700-anbernic-rg40xx-v.dtb",
			"sun50i-h700-anbernic-rg40xx-v-v2-panel.dtb"
		}
		file extlinux/extlinux.conf {
			image = "extlinux.conf"
		}
	}
	size = 64M
}

image data.ext4 {
	empty = true
	temporary = true
	size = 32M
	ext4 {
		label = "BRAINODATA"
		use-mke2fs = true
	}
}

image braino-rg40xxv.img {
	hdimage {
		partition-table-type = "mbr"
	}

	partition u-boot {
		in-partition-table = false
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
		size = 1016K
	}

	partition boot {
		partition-type = 0xC
		bootable = true
		image = "boot.vfat"
		offset = 1M
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
