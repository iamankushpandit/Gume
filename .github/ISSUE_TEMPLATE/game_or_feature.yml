name: Game or feature idea
description: A new game, a new screen, or a change to how one works.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Every game runs on every device Braino runs on: the ESP32 boards, the
        Attaky Cyber Deck Plus and the Anbernic RG40XX V. On the ESP32 boards
        flash is the binding constraint -- over 80% of the 3 MB app partition is
        already used, and artwork and data tables dominate. That is not a reason
        not to propose something; it is what your proposal will be weighed
        against, so it is better said up front.

  - type: textarea
    id: idea
    attributes:
      label: What is it
      description: What the player does, and what they get better at by doing it.
    validations:
      required: true

  - type: input
    id: knows
    attributes:
      label: What a player needs to know first
      description: What a player has to be able to do already to start it.
      placeholder: Can count to 20

  - type: dropdown
    id: kind
    attributes:
      label: What kind of change
      options:
        - A new game
        - A new system screen
        - A change to an existing game or screen
        - Something else
    validations:
      required: true

  - type: textarea
    id: transmits
    attributes:
      label: Does it transmit, store, or share anything?
      description: >-
        **Read this even if the answer is obviously no.** Exactly four things
        leave the device -- an NTP query, one `ip-api.com` timezone lookup, the
        opt-in BLE beacon, and the daily check for a newer version -- and
        [that list is closed](../../CONTRIBUTING.md#no-data-collection). A
        proposal that adds a fifth needs agreement in this issue before any
        code exists, because it changes what the product promises rather than
        adding a feature to be judged on merit. Scores and profiles staying in
        the console's own storage is not transmitting.
      placeholder: >-
        No — scores only, through the normal scoped storage API.
    validations:
      required: true

  - type: textarea
    id: cost
    attributes:
      label: Rough cost
      description: >-
        Optional, and a guess is fine. Mostly: does it need artwork or a data
        table? Those are what actually consume the partition.
