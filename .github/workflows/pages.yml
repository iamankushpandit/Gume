name: Pages

# Builds every firmware environment, generates the site around them with
# tools/gen_site.py, and publishes the result to GitHub Pages. The flash button
# on the page is only as fresh as this run, so it runs on every push to main.
#
# Enable it once, in Settings -> Pages -> Build and deployment -> GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `enablement: true` turns Pages on for the repository the first time
      # this runs, so the site does not need a visit to Settings -> Pages to go
      # live, and is a no-op on every run after that. It is allowed to fail:
      # the API refuses when the repository's default workflow permissions are
      # read-only, and that must not cost us the firmware build -- the deploy
      # job is the honest test of whether Pages is on.
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Fail fast. Site generation runs BEFORE the expensive PlatformIO
      # install and the ten-environment firmware build, so a structural
      # failure -- a missing template placeholder, an orphaned still, a board
      # with no BOARD_DETAILS entry, a VARIANTS environment that does not
      # exist -- is discovered in seconds instead of after twenty minutes of
      # compiling. None of those failures depend on a single byte of firmware,
      # so there is nothing to be gained by finding them later.
      #
      # This writes the real _site directory that the rest of the job fills
      # in: the steps below copy each environment's binaries next to the
      # manifests laid down here, and then prove every manifest resolves.
      - name: Generate the site
        run: |
          python tools/gen_site.py \
            --out _site \
            --repo "${{ github.server_url }}/${{ github.repository }}"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # Every environment, not just the ones the installer offers. batdiag
      # was built by neither workflow for its whole life: check_docs.py only
      # validates environments listed in gen_site.py's VARIANTS, and a bench
      # tool is deliberately not offered on the flashing page, so it fell
      # through every net. An environment nobody builds is an environment
      # that is already broken and has not been told yet.
      - name: Build firmware
        run: pio run -e app -e bringup -e batdiag -e wifidiag -e app_esp32_2432s028r -e bringup_esp32_2432s028r -e batdiag_esp32_2432s028r -e app_esp32_2432s028_st7789 -e bringup_esp32_2432s028_st7789 -e batdiag_esp32_2432s028_st7789 -e app_fnk0104b -e app_e32r40t -e s3diag -e diag4

      # Flash is the scarce resource here (3 MB partition), so put the image
      # size where a reviewer sees it without opening the build log.
      - name: Report image sizes
        run: |
          {
            echo '### Firmware image sizes'
            echo
            echo '| Environment | firmware.bin | of 3,145,728 |'
            echo '|---|---:|---:|'
            for env in app bringup batdiag wifidiag app_esp32_2432s028r bringup_esp32_2432s028r batdiag_esp32_2432s028r app_esp32_2432s028_st7789 bringup_esp32_2432s028_st7789 batdiag_esp32_2432s028_st7789 app_fnk0104b app_e32r40t s3diag diag4; do
              bytes=$(stat -c%s ".pio/build/$env/firmware.bin")
              printf '| %s | %s | %.1f%% |\n' "$env" "$bytes" \
                "$(python -c "print($bytes / 3145728 * 100)")"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # The env list is *derived* from what gen_site.py actually laid down,
      # never written out again here. Every environment is still built above --
      # that is the point of building them -- but only the ones the site offers
      # for download get binaries copied beside a manifest.
      #
      # This loop used to hard-code "app bringup wifidiag" while gen_site.py's
      # BOARDS declared envs: ("app",). It created app/, then asserted a
      # bringup/ directory that nothing had any reason to create, and exited 1
      # -- so every Pages deploy from 2026-08-15 onward died *after* a clean
      # three-environment build, and the installer page silently stayed on the
      # last version that happened to publish. Deriving the list is what stops
      # that recurring: add a variant to gen_site.py and it is picked up here
      # with no second edit.
      - name: Collect the binaries next to their manifests
        run: |
          set -euo pipefail
          boot_app0=$(find ~/.platformio/packages -name boot_app0.bin -path '*partitions*' | head -n 1)
          test -n "$boot_app0"
          shopt -s nullglob
          copied=0
          for dest in _site/firmware/*/*/; do
            env=$(basename "$dest")
            # The site asked for an environment CI did not build: that is a
            # real mismatch and should fail here, not in someone's browser.
            test -d ".pio/build/$env"
            cp ".pio/build/$env/firmware.bin"   "$dest"
            cp ".pio/build/$env/bootloader.bin" "$dest"
            cp ".pio/build/$env/partitions.bin" "$dest"
            cp "$boot_app0"                     "$dest"
            ls -l "$dest"
            copied=$((copied + 1))
          done
          # Publishing an installer page with no firmware behind the button is
          # worse than failing: it looks like it works.
          test "$copied" -gt 0
          echo "Copied binaries for $copied environment(s)."

      # A manifest that points at a missing .bin fails only at flash time, in
      # the user's browser, halfway through erasing their board. Check here.
      - name: Verify every manifest resolves
        run: |
          python - <<'PY'
          import json, os, sys
          missing = []
          for root, _, files in os.walk("_site/firmware"):
              if "manifest.json" not in files:
                  continue
              with open(os.path.join(root, "manifest.json")) as handle:
                  manifest = json.load(handle)
              for build in manifest["builds"]:
                  for part in build["parts"]:
                      path = os.path.join(root, part["path"])
                      if not os.path.isfile(path):
                          missing.append(path)
          if missing:
              sys.exit("missing firmware parts:\n  " + "\n  ".join(missing))
          print("all manifests resolve")
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
