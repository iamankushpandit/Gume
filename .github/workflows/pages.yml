name: Pages

# Builds every firmware environment, generates the site around them with
# tools/gen_site.py, and publishes the result to GitHub Pages. The flash button
# on the page is only as fresh as this run, so it runs on every push to main.
#
# Enable it once, in Settings -> Pages -> Build and deployment -> GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `enablement: true` turns Pages on for the repository the first time
      # this runs, so the site does not need a visit to Settings -> Pages to go
      # live, and is a no-op on every run after that. It is allowed to fail:
      # the API refuses when the repository's default workflow permissions are
      # read-only, and that must not cost us the firmware build -- the deploy
      # job is the honest test of whether Pages is on.
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # `main` deliberately carries a machine-local path for map-n-flag (see
      # the build gotchas in CLAUDE.md). Any other checkout has to swap it for
      # the public URL, and CI is another checkout. The edit is to the runner's
      # working copy only and is never committed.
      - name: Point map-n-flag at its public repository
        run: |
          sed -i 's|file://C:/Users/Ankus/CppEsp32Lib|https://github.com/iamankushpandit/map-n-flag.git|' platformio.ini
          grep -n 'map-n-flag' platformio.ini

      # The board matrix lives in gen_site.py, and CI asks it what to build
      # rather than keeping a second copy. A board offered on the page can then
      # never go unbuilt -- that is the failure that publishes a manifest whose
      # binaries do not exist.
      - name: Build firmware
        run: |
          set -euo pipefail
          args=""
          for env in $(python tools/gen_site.py --print-envs); do
            args="$args -e $env"
          done
          echo "building:$args"
          pio run $args

      # Flash is the scarce resource here (3 MB partition), so put the image
      # size where a reviewer sees it without opening the build log.
      - name: Report image sizes
        run: |
          set -euo pipefail
          {
            echo '### Firmware image sizes'
            echo
            echo '| Environment | firmware.bin | of 3,145,728 |'
            echo '|---|---:|---:|'
            for env in $(python tools/gen_site.py --print-envs); do
              bytes=$(stat -c%s ".pio/build/$env/firmware.bin")
              printf '| %s | %s | %.1f%% |\n' "$env" "$bytes" \
                "$(python -c "print($bytes / 3145728 * 100)")"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate the site
        run: python tools/gen_site.py --out _site --repo "${{ github.server_url }}/${{ github.repository }}"

      # builds.json says which environment feeds which published directory, so
      # this step does not need to know the board list either.
      - name: Collect the binaries next to their manifests
        run: |
          set -euo pipefail
          boot_app0=$(find ~/.platformio/packages -name boot_app0.bin -path '*partitions*' | head -n 1)
          test -n "$boot_app0"
          python - "$boot_app0" <<'PY'
          import json, os, shutil, sys

          boot_app0 = sys.argv[1]
          with open("_site/builds.json") as handle:
              builds = json.load(handle)

          for build in builds:
              dest = os.path.join("_site", *build["dir"].split("/"))
              src = os.path.join(".pio", "build", build["env"])
              if not os.path.isdir(dest):
                  sys.exit("no published directory for %s" % build["dir"])
              for name in ("firmware.bin", "bootloader.bin", "partitions.bin"):
                  shutil.copy(os.path.join(src, name), os.path.join(dest, name))
              shutil.copy(boot_app0, os.path.join(dest, "boot_app0.bin"))
              print("%-34s <- .pio/build/%s" % (build["dir"], build["env"]))
          PY

      # A manifest that points at a missing .bin fails only at flash time, in
      # the user's browser, halfway through erasing their board. Check here.
      - name: Verify every manifest resolves
        run: |
          python - <<'PY'
          import json, os, sys
          missing = []
          for root, _, files in os.walk("_site/firmware"):
              if "manifest.json" not in files:
                  continue
              with open(os.path.join(root, "manifest.json")) as handle:
                  manifest = json.load(handle)
              for build in manifest["builds"]:
                  for part in build["parts"]:
                      path = os.path.join(root, part["path"])
                      if not os.path.isfile(path):
                          missing.append(path)
          if missing:
              sys.exit("missing firmware parts:\n  " + "\n  ".join(missing))
          print("all manifests resolve")
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
