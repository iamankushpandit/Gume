name: CI

# Runs on every branch, main included. It used to carry
# `branches-ignore: [main]`, on the reasoning that main only ever receives pull
# requests and so is covered by the pull_request trigger. It was not: work
# reached main without a pull request, and four files sat over the frame-rule
# baseline on main for weeks while every branch below it reported green. A
# check that never runs on the branch it protects is a convention, not a check.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Check if code files changed
        id: code_changed
        run: |
          # Get list of changed files
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD)
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          fi

          # Check if any non-doc files changed
          CODE_FILES=$(echo "$CHANGED_FILES" | grep -v -E '^\.(md|txt|png|jpg|svg)$|^(README|CHANGELOG|CONTRIBUTING|LICENSE|docs/|cases/|site/)' | grep -E '\.(cpp|h|ini|py)$' || true)

          if [ -z "$CODE_FILES" ]; then
            echo "has_code_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_code_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Run repository checks
        run: |
          python tools/check_docs.py
          python tools/check_boards.py
          python tools/check_catalog.py
          python tools/check_frame_rules.py

      - name: Run privacy audit (code changes only)
        if: steps.code_changed.outputs.has_code_changes == 'true'
        run: python tools/check_privacy.py

      - name: Build firmware (code changes only)
        if: steps.code_changed.outputs.has_code_changes == 'true'
        run: pio run -e app -e bringup -e wifidiag
