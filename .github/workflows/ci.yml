name: CI

# Runs on every pull request, and on pushes to the two protected branches.
# It used to carry `branches-ignore: [main]`, on the reasoning that main only
# ever receives pull requests and so is covered by the pull_request trigger. It
# was not: work reached main without a pull request, and four files sat over the
# frame-rule baseline on main for weeks while every branch below it reported
# green. A check that never runs on the branch it protects is a convention, not
# a check.
#
# The fix for that was `on: push` with no filter, which then ran the whole job
# twice for every commit on a branch with a pull request open -- once for the
# push, once for the pull request. Naming main and dev keeps the branch the
# push trigger exists to protect, and drops the duplicate. A feature branch is
# covered from the moment its pull request is opened, which is when its result
# starts mattering to anyone else.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# A new push to a pull request makes the run for the old one worthless, so it
# is cancelled. Pushes to main and dev are not: each is a commit that reached
# a protected branch and gets its own result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Four jobs, because the builds are independent and a runner is not:
#
#   plan    every repository check, then decides which environments to build
#           and installs their toolchains once, into one shared cache.
#   build   one job PER ENVIRONMENT, on its own runner, all at once. A push to
#           dev builds every product board; one after another on one runner that was
#           14-15 minutes, in parallel it is roughly the slowest single board.
#   host    the firmware built for a PC (host/), and every test in test/host/
#           (tools/run_host_tests.py). The card image itself is
#           card-image.yml: it takes an hour, and is not a check on every
#           change.
#   verify  the required status check. It waits for the builds and fails if
#           any failed -- see the note on it below.
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.scope.outputs.envs }}
      host: ${{ steps.scope.outputs.host }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # What this change reaches, decided ONCE, from one list of changed
      # files, by tools/envs.py -- never by a pattern in this file:
      #
      #   envs  the ESP32 environments to build, as the build job's matrix:
      #         `app` for any firmware source, one board for that board's
      #         header, every board for platformio.ini or the board contract,
      #         a probe when its own source moves, and [] for a change that
      #         reaches no board (documentation, tools, host/, test/).
      #   host  whether the PC build of host/ is reached. The host TESTS run
      #         regardless; see the host job.
      #
      # A push to main or dev builds every product and experimental board and
      # the PC build whatever the diff said (--with-product): those are the
      # branches the installer and the release are cut from.
      #
      # The repository checks below are cheap and run unconditionally -- a
      # documentation-only change is exactly what check_docs.py exists to
      # police.
      #
      # Two lists lived in this file before -- one for the push path, one for
      # the pull request path -- and pages.yml carried a third. All three had
      # drifted: none of them built `audiodiag`, `diag32p` or
      # `audiodiag_e32r32p`, which had existed for months. A list of
      # environments maintained in YAML is a list that is wrong and cannot
      # say so.
      - name: Decide what this change needs built
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" --jq '.[].filename' > "$RUNNER_TEMP/changed.txt"
          else
            # A first push to a branch has no `before` commit to diff against.
            before="${{ github.event.before }}"
            zero=0000000000000000000000000000000000000000
            if [ -n "$before" ] && [ "$before" != "$zero" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
              git diff --name-only "$before" "${{ github.sha }}" > "$RUNNER_TEMP/changed.txt"
            else
              echo platformio.ini > "$RUNNER_TEMP/changed.txt"   # unknown scope: build the lot
            fi
          fi
          echo "Files considered:"
          sed 's/^/  /' "$RUNNER_TEMP/changed.txt"

          WITH_PRODUCT=""
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            WITH_PRODUCT="--with-product"
          fi
          # The build job's matrix: one {env, board, name} per environment,
          # named after the board so a red job says which board broke. []
          # when nothing needs building.
          ENVS="$(python tools/envs.py --for-changes $WITH_PRODUCT --matrix < "$RUNNER_TEMP/changed.txt")"
          HOST="$(python tools/envs.py --for-changes $WITH_PRODUCT --reaches-host < "$RUNNER_TEMP/changed.txt")"
          echo "Boards to build: $ENVS"
          echo "PC build reached: $HOST"
          echo "envs=$ENVS" >> "$GITHUB_OUTPUT"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "args=$(python tools/envs.py --for-changes $WITH_PRODUCT --pio-args < "$RUNNER_TEMP/changed.txt")" >> "$GITHUB_OUTPUT"

      # The toolchains, ONCE. This job installs every package the chosen
      # environments need and is the only job that saves this cache; the
      # build jobs restore it read-only. Seven jobs each caching their own
      # ~/.platformio would be seven copies of roughly a gigabyte against the
      # repository's 10 GB cache, and eviction would quietly make runs slow
      # again. The ESP32-S3 toolchain lives in the same cache as the ESP32 one.
      - name: Cache PlatformIO
        if: steps.scope.outputs.envs != '[]'
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        if: steps.scope.outputs.envs != '[]'
        run: pip install --upgrade platformio

      - name: Validate Python tools for syntax errors
        run: |
          python -m py_compile tools/check_docs.py
          python -m py_compile tools/check_boards.py
          python -m py_compile tools/check_catalog.py
          python -m py_compile tools/check_frame_rules.py
          python -m py_compile tools/check_privacy.py
          python -m py_compile tools/check_identifiers.py
          python -m py_compile tools/check_card_inputs.py
          python -m py_compile tools/card_inputs.py
          python -m py_compile tools/check_licenses.py
          python -m py_compile tools/gen_site.py
          python -m py_compile tools/gen_board_docs.py

      # Pillow for gen_board_docs.py --check, which opens any board photo in
      # docs/boards/img/ to refuse one still carrying EXIF (a GPS position, a
      # phone serial, a name). Seconds to install; not gated on firmware
      # changes, because a photo arrives in a docs-only pull request.
      - name: Install Pillow
        run: pip install pillow

      - name: Run repository checks
        run: |
          python tools/check_docs.py
          python tools/check_boards.py
          python tools/check_catalog.py
          python tools/check_frame_rules.py
          python tools/check_privacy.py
          # A licence at the root of a repository is a claim about the
          # repository; the file is what reaches whoever copies one thing out
          # of it. Every file that can carry the notice carries it.
          python tools/check_licenses.py
          # Board pages are generated from the profiles; a stale one fails here.
          python tools/gen_board_docs.py --check

          # A hardware identifier cannot be un-published: a MAC is burned into
          # eFuse, so it names that board for its whole life. board_registry.json
          # mapped six of them to the firmware each was running and reached two
          # releases before anybody noticed. This check runs on every PR because
          # noticing is exactly what did not happen.
          python tools/check_identifiers.py

          # The card image's OS base is named after what tools/card_inputs.py
          # calls the OS; card-image.yml's trigger paths and Buildroot version
          # are held to it here, where a docs-only change still runs.
          python tools/check_card_inputs.py

      # main is the released state, and only a check can keep it that way.
      #
      # Merging dev into main to publish the site carried dev's -SNAPSHOT with
      # it, because a merge brings the whole branch. Pages then built the
      # installer from main and offered a snapshot as `latest`, and wrote it
      # into firmware/latest.txt, which every console with Wi-Fi reads -- so
      # owners on the real release were told to update to an unreleased build.
      #
      # The checks above all passed and none of them was wrong: they assert
      # that AppVersion.h, the README and the CHANGELOG agree with each other,
      # and all three said 5.13.0-SNAPSHOT. release.yml refuses a -SNAPSHOT
      # only when publishing a tag, which is long after the merge that caused
      # it.
      #
      # Gated on main because dev carries a snapshot between releases by
      # design; `base_ref` catches it at the pull request, before the merge.
      - name: main must carry a released version
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: python tools/check_docs.py --released

      # Site generation is cheap -- seconds, pure standard library, no
      # PlatformIO -- and it MUST run on every pull request. Do not put this
      # step behind `steps.scope.outputs.envs` or any other firmware-source
      # gate.
      #
      # The reasoning is the whole point of the step. The firmware gate above
      # deliberately skips changes under site/, docs/, tools/ and .github/,
      # and to Markdown -- and those are exactly the changes most likely to
      # break the installer: a renamed template placeholder, a new still that
      # nothing references, a board section gen_site.py cannot label, a
      # VARIANTS entry pointing at an environment no workflow builds. Gate
      # this on firmware source and the only run that would have caught any of
      # them is the one that never happens.
      #
      # gen_site.py is a headline path: it writes the landing page and the
      # esp-web-tools manifests behind the flash button. When it fails, it
      # fails in someone else's browser, and until now it was only ever
      # executed by the Pages workflow -- after merge to main, where the cost
      # of finding out is a dead installer rather than a red pull request.
      #
      # It runs before any firmware exists, which is why no build is needed:
      # it lays down the manifests, and Pages later copies .bin files beside
      # them. Output goes to a scratch directory outside the repository so the
      # run cannot leave the working tree dirty.
      - name: Generate the site and installer manifests
        run: |
          python tools/gen_site.py \
            --out /tmp/gume-site-check \
            --repo "${{ github.server_url }}/${{ github.repository }}"

      # Download every toolchain and library the chosen environments need, so
      # the cache above holds all of them and no build job downloads anything.
      - name: Install the toolchains the builds will need
        if: steps.scope.outputs.envs != '[]'
        run: pio pkg install ${{ steps.scope.outputs.args }}

  build:
    needs: plan
    if: needs.plan.outputs.envs != '[]'
    runs-on: ubuntu-latest
    strategy:
      # Every board reports. One broken board must not cancel the others and
      # hide whether they were broken too.
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.envs) }}
    # "build E32R28T-1 (app)": the board, then the environment to reproduce it.
    name: build ${{ matrix.target.name }}
    steps:
      # A shallow checkout is enough: tools/build_stamp.py reads the branch
      # from GITHUB_HEAD_REF / GITHUB_REF_NAME and the commit from
      # `git rev-parse`, and neither needs history.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Read-only: `plan` installed and saved it. Restoring the exact key
      # first means a hit is the complete set, not a partial older one.
      - name: Restore PlatformIO
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      # The compiled-object cache, one per ENVIRONMENT. Every board's display
      # macros are global compile flags, so no two boards produce the same
      # object and there is nothing to share between them; a per-board key
      # keeps each cache small and each job restoring only what it can use.
      #
      # Until the build stamp moved out of CPPDEFINES there was no point
      # caching build output at all: every object's compile command carried
      # the commit hash, and every CI run is a new commit. Measured locally
      # after the move: one object and ~35 s for a new commit, against every
      # object and ~8 minutes before. The cache is content-addressed, so a
      # restored entry is either right or is not a hit.
      #
      # Restored here, saved below -- and saved only from a push to main or
      # dev, pruned to what this build used. Both halves are measured: on
      # 2026-11-18 the repository held 11.9 GB of caches against GitHub's
      # 10 GB, so it was evicting, and most of it was this cache. The key
      # rotates per commit so it keeps absorbing new objects, and nothing
      # ever took old ones out, so each board's copy had grown from 142 MB
      # to 184 MB in a week, against 37 MB for one build; and every pull
      # request saved five more copies that only that pull request could
      # read. A pull request restores dev's, which differs from it by the
      # few files it changed.
      - name: Restore compiled objects
        uses: actions/cache/restore@v4
        with:
          path: .pio/build_cache
          key: objects-${{ runner.os }}-${{ matrix.target.env }}-${{ hashFiles('platformio.ini') }}-${{ github.sha }}
          restore-keys: |
            objects-${{ runner.os }}-${{ matrix.target.env }}-${{ hashFiles('platformio.ini') }}-
            objects-${{ runner.os }}-${{ matrix.target.env }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build ${{ matrix.target.name }}
        run: |
          touch "$RUNNER_TEMP/build-started"
          pio run -e ${{ matrix.target.env }}

      # SCons stamps every cache entry it reads with the time it read it
      # (os.utime in CacheDir.CacheRetrieveFunc) and writes new ones with the
      # time they were compiled, and this job starts from an empty .pio/build,
      # so after the build every object it needed is newer than the marker
      # and everything older is an object no build of this commit uses.
      - name: Drop objects this build did not use
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        run: |
          mkdir -p .pio/build_cache
          echo "Before: $(du -sh .pio/build_cache | cut -f1), $(find .pio/build_cache -type f | wc -l) objects"
          find .pio/build_cache -type f ! -newer "$RUNNER_TEMP/build-started" -delete
          find .pio/build_cache -mindepth 1 -type d -empty -delete
          echo "After:  $(du -sh .pio/build_cache | cut -f1), $(find .pio/build_cache -type f | wc -l) objects"

      - name: Save compiled objects
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        uses: actions/cache/save@v4
        with:
          path: .pio/build_cache
          key: objects-${{ runner.os }}-${{ matrix.target.env }}-${{ hashFiles('platformio.ini') }}-${{ github.sha }}

      # The build is attached to the run so that somebody who owns the board
      # and not the toolchain can test it before it is released. A board port
      # arrives as an issue from a person holding a board nobody here has
      # (issue 200 was one), and until this step the only way to hand them
      # the image was to build it on a laptop and zip it into a comment.
      # Packed exactly as a release is -- the four parts, one merged image
      # written at 0x0, FLASHING.txt saying how -- by the same tool, so what
      # a tester flashes is what the release will ship. --only packs this
      # job's environment alone; a release still packs every one.
      #
      # A product or an experimental environment is worth attaching: nobody
      # flashes a bench probe from a download, and a release does not ship
      # one. An experimental image is attached here and nowhere else -- this
      # run is the only way it reaches a tester.
      - name: Pack ${{ matrix.target.name }} for testers
        if: matrix.target.kind == 'product' || matrix.target.kind == 'experimental'
        run: >-
          python tools/pack_release.py
          --only ${{ matrix.target.env }}
          --out dist
          --built "CI build of ${{ github.head_ref || github.ref_name }}
          (commit $(git rev-parse --short=7 HEAD)), not a release"

      - name: Attach ${{ matrix.target.name }} to the run
        if: matrix.target.kind == 'product' || matrix.target.kind == 'experimental'
        uses: actions/upload-artifact@v4
        with:
          name: braino-${{ matrix.target.env }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

  # The firmware as a Linux program, the way the handheld image builds it --
  # but natively and with an SDL window, which is minutes rather than the
  # card image's hours, and catches the same thing first: a change under
  # src/ that the host's stand-ins for Arduino, the panel and the board do
  # not cover. host/CLAUDE.md: host/ adapts to src/, never the reverse.
  #
  # Then every test in test/host/. The job runs on every pull request, even
  # a documentation-only one: the tests take about a minute with the
  # runner's own g++ and need nothing installed, and the runner that decides
  # what they are lives in tools/, which the firmware gate skips. Only the
  # SDL build -- an apt install and under a minute of compiling -- waits for
  # a change that reaches it (`tools/envs.py --reaches-host`).
  host:
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # SDL2's headers pull in about 80 packages, 37 MB, and Ubuntu's mirror
      # for the runners is not always quick: on 2026-11-18 it served them at
      # 88 kB/s and this step took 7.5 minutes of an 8-minute run. So the
      # .deb files are kept in a cache, a new one each week (a package
      # updated that week is the only download), and apt only installs.
      - name: Week of the year, for the package cache
        if: needs.plan.outputs.host == 'true'
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore the downloaded packages
        if: needs.plan.outputs.host == 'true'
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-host-${{ runner.os }}-24.04-${{ steps.week.outputs.week }}
          restore-keys: apt-host-${{ runner.os }}-24.04-

      - name: Install the host build's libraries
        if: needs.plan.outputs.host == 'true'
        run: |
          mkdir -p "$HOME/apt-archives/partial"
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 -o Dir::Cache::Archives="$HOME/apt-archives" \
            install -y --no-install-recommends cmake pkg-config libsdl2-dev libcurl4-openssl-dev
          # apt downloads as root; the cache is saved by the runner's user.
          sudo rm -rf "$HOME/apt-archives/partial" "$HOME/apt-archives/lock"
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives"
          du -sh "$HOME/apt-archives"

      - name: Build Braino for a PC
        if: needs.plan.outputs.host == 'true'
        run: |
          cmake -S host -B build/host -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host -j "$(nproc)"

      # Every test/host/*_test.cpp, each built with the g++ line its own
      # header gives a reader -- there is no list of tests here or in the
      # script, so a new test is run from the commit that adds it, and one
      # whose header states no build line fails rather than being skipped.
      # Every test runs whatever the others did, prints its whole output, and
      # the summary at the end names each one with its result; any failure
      # fails this job, and through it `verify`.
      #
      # It runs even when the SDL build above failed, so that one red job
      # still says which tests pass.
      - name: Host tests -- every test in test/host/
        if: ${{ !cancelled() }}
        run: python3 tools/run_host_tests.py

  # `verify` is the required status check in the "Protect main" and "Protect
  # dev" rulesets, so it must report on EVERY pull request, including
  # documentation-only ones -- a required check that does not run is not
  # "passed", it is "expected", and the pull request stays unmergeable
  # forever. That is why it runs `if: always()` and judges the other two
  # jobs itself rather than being skipped with them.
  #
  # Do not rename this job, and do not make the matrix jobs the required
  # check: their names carry the environment, so the set of names changes
  # with the diff, and a ruleset can only wait for names it knows.
  verify:
    needs: [plan, build, host]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Judge the checks and the builds
        run: |
          echo "plan:  ${{ needs.plan.result }}"
          echo "build: ${{ needs.build.result }}"
          echo "host:  ${{ needs.host.result }}"
          # plan must succeed. build may be skipped (nothing needed
          # building); host runs on every pull request, and is skipped only
          # if plan failed. Neither may fail or be cancelled.
          [ "${{ needs.plan.result }}" = "success" ] || exit 1
          for result in "${{ needs.build.result }}" "${{ needs.host.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
