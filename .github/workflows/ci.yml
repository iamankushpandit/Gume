name: CI

# Runs on every pull request, and on pushes to the two protected branches.
# It used to carry `branches-ignore: [main]`, on the reasoning that main only
# ever receives pull requests and so is covered by the pull_request trigger. It
# was not: work reached main without a pull request, and four files sat over the
# frame-rule baseline on main for weeks while every branch below it reported
# green. A check that never runs on the branch it protects is a convention, not
# a check.
#
# The fix for that was `on: push` with no filter, which then ran the whole job
# twice for every commit on a branch with a pull request open -- once for the
# push, once for the pull request. Naming main and dev keeps the branch the
# push trigger exists to protect, and drops the duplicate. A feature branch is
# covered from the moment its pull request is opened, which is when its result
# starts mattering to anyone else.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# Three jobs, because the builds are independent and a runner is not:
#
#   plan    every repository check, then decides which environments to build
#           and installs their toolchains once, into one shared cache.
#   build   one job PER ENVIRONMENT, on its own runner, all at once. A push to
#           dev builds seven boards; one after another on one runner that was
#           14-15 minutes, in parallel it is roughly the slowest single board.
#   verify  the required status check. It waits for the builds and fails if
#           any failed -- see the note on it below.
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
      envs: ${{ steps.environments.outputs.envs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The repository checks below are cheap and run unconditionally -- a
      # documentation-only change is exactly what check_docs.py exists to
      # police. Compiling the firmware to prove that a paragraph in the README
      # still compiles is the part with nothing to say.
      - name: Decide whether the firmware needs building
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull request -- building."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" \
            --jq '.[].filename')
          echo "Files changed by this pull request:"
          printf '%s\n' "$files" | sed 's/^/  /'
          if printf '%s\n' "$files" \
             | grep -qvE '^(docs/|cases/|site/|tools/|\.github/)|\.md$|^LICENSE$'; then
            echo "Source code changed -- building firmware."
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Non-source files only (docs, tools, CI config) -- skipping firmware build."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

      # The toolchains, ONCE. This job installs every package the chosen
      # environments need and is the only job that saves this cache; the
      # build jobs restore it read-only. Seven jobs each caching their own
      # ~/.platformio would be seven copies of roughly a gigabyte against the
      # repository's 10 GB cache, and eviction would quietly make runs slow
      # again. The ESP32-S3 toolchain lives in the same cache as the ESP32 one.
      - name: Cache PlatformIO
        if: steps.scope.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        if: steps.scope.outputs.code == 'true'
        run: pip install --upgrade platformio

      - name: Validate Python tools for syntax errors
        run: |
          python -m py_compile tools/check_docs.py
          python -m py_compile tools/check_boards.py
          python -m py_compile tools/check_catalog.py
          python -m py_compile tools/check_frame_rules.py
          python -m py_compile tools/check_privacy.py
          python -m py_compile tools/check_identifiers.py
          python -m py_compile tools/gen_site.py

      - name: Run repository checks
        run: |
          python tools/check_docs.py
          python tools/check_boards.py
          python tools/check_catalog.py
          python tools/check_frame_rules.py
          python tools/check_privacy.py
          # A hardware identifier cannot be un-published: a MAC is burned into
          # eFuse, so it names that board for its whole life. board_registry.json
          # mapped six of them to the firmware each was running and reached two
          # releases before anybody noticed. This check runs on every PR because
          # noticing is exactly what did not happen.
          python tools/check_identifiers.py

      # Site generation is cheap -- seconds, pure standard library, no
      # PlatformIO -- and it MUST run on every pull request. Do not put this
      # step behind `steps.scope.outputs.code` or any other firmware-source
      # gate.
      #
      # The reasoning is the whole point of the step. The firmware gate above
      # deliberately skips changes under site/, docs/, tools/ and .github/,
      # and to Markdown -- and those are exactly the changes most likely to
      # break the installer: a renamed template placeholder, a new still that
      # nothing references, a board section gen_site.py cannot label, a
      # VARIANTS entry pointing at an environment no workflow builds. Gate
      # this on firmware source and the only run that would have caught any of
      # them is the one that never happens.
      #
      # gen_site.py is a headline path: it writes the landing page and the
      # esp-web-tools manifests behind the flash button. When it fails, it
      # fails in someone else's browser, and until now it was only ever
      # executed by the Pages workflow -- after merge to main, where the cost
      # of finding out is a dead installer rather than a red pull request.
      #
      # It runs before any firmware exists, which is why no build is needed:
      # it lays down the manifests, and Pages later copies .bin files beside
      # them. Output goes to a scratch directory outside the repository so the
      # run cannot leave the working tree dirty.
      - name: Generate the site and installer manifests
        run: |
          python tools/gen_site.py \
            --out /tmp/gume-site-check \
            --repo "${{ github.server_url }}/${{ github.repository }}"

      # Which environments to build, decided by tools/envs.py rather than by
      # a list in this file.
      #
      # Two lists lived here before -- one for the push path, one for the pull
      # request path -- and pages.yml carried a third. All three had drifted:
      # none of them built `audiodiag`, `diag32p` or `audiodiag_e32r32p`, which
      # had existed for months. A list of environments maintained in YAML is a
      # list that is wrong and cannot say so.
      #
      # The rule the tool applies: the seven `product` environments are Braino!
      # and are what CI is protecting. The fourteen `diagnostic` ones are bench
      # probes -- they are built when their own source or platformio.ini moves,
      # and not otherwise. A push to main or dev builds every product
      # environment regardless, because that is the branch the installer and
      # the release are cut from.
      - name: Decide which environments to build
        id: environments
        if: steps.scope.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" --jq '.[].filename' > "$RUNNER_TEMP/changed.txt"
          else
            # A first push to a branch has no `before` commit to diff against.
            before="${{ github.event.before }}"
            zero=0000000000000000000000000000000000000000
            if [ -n "$before" ] && [ "$before" != "$zero" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
              git diff --name-only "$before" "${{ github.sha }}" > "$RUNNER_TEMP/changed.txt"
            else
              echo platformio.ini > "$RUNNER_TEMP/changed.txt"   # unknown scope: build the lot
            fi
          fi
          echo "Files considered:"
          sed 's/^/  /' "$RUNNER_TEMP/changed.txt"

          # --with-product on a push: every board is proven on the branches the
          # installer and the release are cut from, whatever the diff said.
          WITH_PRODUCT=""
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            WITH_PRODUCT="--with-product"
          fi
          # The build job's matrix: one {env, board, name} per environment,
          # named after the board so a red job says which board broke. [] when
          # nothing needs building.
          ENVS="$(python tools/envs.py --for-changes $WITH_PRODUCT --matrix < "$RUNNER_TEMP/changed.txt")"
          echo "Matrix: $ENVS"
          echo "envs=$ENVS" >> "$GITHUB_OUTPUT"
          echo "args=$(python tools/envs.py --for-changes $WITH_PRODUCT --pio-args < "$RUNNER_TEMP/changed.txt")" >> "$GITHUB_OUTPUT"

      # Download every toolchain and library the chosen environments need, so
      # the cache above holds all of them and no build job downloads anything.
      - name: Install the toolchains the builds will need
        if: steps.scope.outputs.code == 'true' && steps.environments.outputs.envs != '[]'
        run: pio pkg install ${{ steps.environments.outputs.args }}

  build:
    needs: plan
    if: needs.plan.outputs.code == 'true' && needs.plan.outputs.envs != '[]'
    runs-on: ubuntu-latest
    strategy:
      # Every board reports. One broken board must not cancel the others and
      # hide whether they were broken too.
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.envs) }}
    # "build E32R28T-1 (app)": the board, then the environment to reproduce it.
    name: build ${{ matrix.target.name }}
    steps:
      # A shallow checkout is enough: tools/build_stamp.py reads the branch
      # from GITHUB_HEAD_REF / GITHUB_REF_NAME and the commit from
      # `git rev-parse`, and neither needs history.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Read-only: `plan` installed and saved it. Restoring the exact key
      # first means a hit is the complete set, not a partial older one.
      - name: Restore PlatformIO
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      # The compiled-object cache, one per ENVIRONMENT. Every board's display
      # macros are global compile flags, so no two boards produce the same
      # object and there is nothing to share between them; a per-board key
      # keeps each cache small and each job restoring only what it can use.
      #
      # Until the build stamp moved out of CPPDEFINES there was no point
      # caching build output at all: every object's compile command carried
      # the commit hash, and every CI run is a new commit. Measured locally
      # after the move: one object and ~35 s for a new commit, against every
      # object and ~8 minutes before. The cache is content-addressed, so a
      # restored entry is either right or is not a hit. The key rotates per
      # run so it keeps absorbing new objects; restore-keys makes the previous
      # run's copy the starting point.
      - name: Cache compiled objects
        uses: actions/cache@v4
        with:
          path: .pio/build_cache
          key: objects-${{ runner.os }}-${{ matrix.target.env }}-${{ hashFiles('platformio.ini') }}-${{ github.sha }}
          restore-keys: |
            objects-${{ runner.os }}-${{ matrix.target.env }}-${{ hashFiles('platformio.ini') }}-
            objects-${{ runner.os }}-${{ matrix.target.env }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build ${{ matrix.target.name }}
        run: pio run -e ${{ matrix.target.env }}

  # `verify` is the required status check in the "Protect main" and "Protect
  # dev" rulesets, so it must report on EVERY pull request, including
  # documentation-only ones -- a required check that does not run is not
  # "passed", it is "expected", and the pull request stays unmergeable
  # forever. That is why it runs `if: always()` and judges the other two
  # jobs itself rather than being skipped with them.
  #
  # Do not rename this job, and do not make the matrix jobs the required
  # check: their names carry the environment, so the set of names changes
  # with the diff, and a ruleset can only wait for names it knows.
  verify:
    needs: [plan, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Judge the checks and the builds
        run: |
          echo "plan:  ${{ needs.plan.result }}"
          echo "build: ${{ needs.build.result }}"
          # plan must succeed. build may be skipped (nothing needed building)
          # but must not fail or be cancelled.
          [ "${{ needs.plan.result }}" = "success" ] || exit 1
          case "${{ needs.build.result }}" in
            success|skipped) exit 0 ;;
            *) exit 1 ;;
          esac
