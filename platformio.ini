[platformio]
default_envs = app

[common]
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.4
    https://github.com/iamankushpandit/map-n-flag.git
    ; NimBLE rather than the core's Bluedroid stack: advertise-only needs a
    ; fraction of the host, and flash is the scarce resource on huge_app.
    h2zero/NimBLE-Arduino@^1.4.2
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -D BOARD_NAME=\"E32R28T-1\"
    ; 3 = landscape with the USB edge at the bottom (1 is the same view
    ; rotated 180). pollTouch() already compensates for every rotation.
    -D CYD_SCREEN_ROTATION=3
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000
    -D SUPPORT_TRANSACTIONS
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
    -D DISABLE_ALL_LIBRARY_WARNINGS=1
    ; Touch's own bit-banged bus (deliberately separate from the TFT's HSPI --
    ; see src/hal/CLAUDE.md). BoardConfig.h derives PIN_TOUCH_* from these.
    -D CYD_TOUCH_MOSI=32
    -D CYD_TOUCH_MISO=39
    -D CYD_TOUCH_SCLK=25

[env:app]
build_src_filter = +<*> -<wifi_diag.cpp>
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
board_build.partitions = huge_app.csv
lib_deps = ${common.lib_deps}
lib_ldf_mode = deep+
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags}

[env:bringup]
build_src_filter = +<*> -<wifi_diag.cpp>
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
board_build.partitions = huge_app.csv
lib_deps = ${common.lib_deps}
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    -D CYD_BRINGUP_ONLY

[common4]
lib_deps = ${common.lib_deps}
build_unflags = ${common.build_unflags}
build_flags =
    -std=gnu++17
    -Wall
    -D BOARD_NAME=\"Generic-4in-ESP32-CYD-ST7796\"
    ; 3 = landscape with the USB edge at the bottom (1 is the same view
    ; rotated 180). pollTouch() already compensates for every rotation.
    -D CYD_SCREEN_ROTATION=3
    -D USER_SETUP_LOADED=1
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    ; Same SPI/backlight/reset pins as the E32R28T-1 -- unverified guess that
    ; this is the same reference PCB family with a bigger panel bolted on.
    ; First bring-up flash is the real test; adjust here if it isn't right.
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    ; GPIO21 (the 2.8" board's backlight pin) produced no backlight at all on
    ; this panel -- trying 27 next, a common alternate on similar ST7796 CYD
    ; variants. PIN_TFT_BACKLIGHT in BoardConfig.h derives from this macro,
    ; so it's the only place that needs to change.
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000
    -D SUPPORT_TRANSACTIONS
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
    -D DISABLE_ALL_LIBRARY_WARNINGS=1
    ; Confirmed against LCDWIKI's official E32R40T/E32N40T Arduino Demo
    ; Instructions PDF: touch (XPT2046) shares the display's physical SPI
    ; pins (12/13/14), arbitrated by its own CS (33)/IRQ (36), rather than a
    ; separate bus like the 2.8" board. Rather than hand-rolling shared-bus
    ; SPI transactions, use TFT_eSPI's own built-in touch extension (the same
    ; one the manufacturer's reference code uses) -- TOUCH_CS activates it,
    ; and CYD_TOUCH_SHARES_SPI switches BoardTouch.cpp to call it instead of
    ; bit-banging these pins as plain GPIO, which would fight the display
    ; driver for ownership of them.
    -D CYD_TOUCH_MOSI=13
    -D CYD_TOUCH_MISO=12
    -D CYD_TOUCH_SCLK=14
    -D CYD_TOUCH_SHARES_SPI=1
    -D TOUCH_CS=33
    -D SPI_TOUCH_FREQUENCY=2500000

[env:app4]
build_src_filter = +<*> -<wifi_diag.cpp>
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
board_build.partitions = huge_app.csv
lib_deps = ${common4.lib_deps}
lib_ldf_mode = deep+
build_unflags = ${common4.build_unflags}
build_flags = ${common4.build_flags}

[env:bringup4]
build_src_filter = +<*> -<wifi_diag.cpp>
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
board_build.partitions = huge_app.csv
lib_deps = ${common4.lib_deps}
build_unflags = ${common4.build_unflags}
build_flags =
    ${common4.build_flags}
    -D CYD_BRINGUP_ONLY

[env:wifidiag]
; Isolated Wi-Fi radio test: builds src/wifi_diag.cpp ALONE, so the TFT, touch,
; SD and game code cannot interfere. Flash it, open the serial monitor, and the
; scan result tells us whether the fault is software or RF.
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv
build_src_filter = +<wifi_diag.cpp>
build_flags =
    -D CYD_WIFI_DIAG
