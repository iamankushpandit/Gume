[platformio]
default_envs = app

[common]
; Everything here is true of Braino! on ANY board. Nothing board-specific may
; live in this section -- that is what the [board_*] sections below are for,
; and tools/check_boards.py fails the build if the two get mixed up.
;
; Every dependency is pinned to an exact version, and the Git one to an
; immutable commit. Not caret ranges: `^7.0.4` had already floated ArduinoJson
; to 7.4.3, so two people checking out the same commit a month apart were
; building different firmware and had no way to tell. The flash figures in
; README.md and CLAUDE.md are a claim about a specific build, and a range makes
; that claim unverifiable by anyone but whoever measured it.
;
; These are the versions the documented figures were measured against
; (2,353,221 bytes flash / 72,588 bytes RAM for env:app), not the newest
; releases. Bump them deliberately, as their own commit, and re-measure.
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.4.3
    ; No tags upstream, so the commit is the only immutable handle. Tracking
    ; the default branch meant the artwork tables could change under a release
    ; build without a single byte changing in this repository. MIT; the
    ; library ships its own LICENSE and NOTICE.md, and NOTICE.md here records
    ; the attribution.
    https://github.com/iamankushpandit/map-n-flag.git#3c412cb5cea4dcc5c696abd7a4db78470a97fbd1
    ; NimBLE rather than the core's Bluedroid stack: advertise-only needs a
    ; fraction of the host, and flash is the scarce resource on huge_app.
    h2zero/NimBLE-Arduino@1.4.3
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -D USER_SETUP_LOADED=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SUPPORT_TRANSACTIONS
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
    -D DISABLE_ALL_LIBRARY_WARNINGS=1

[esp32_common]
; The MCU side of the target, shared by every environment on an ESP32 board.
;
; Pinned, for the same reason the libraries are. A bare `platform = espressif32`
; resolves to whatever is newest on the day of the build, which silently changes
; the Arduino core, the Xtensa toolchain and esptool underneath a checkout that
; has not changed at all -- so a contributor bisecting a bug can be handed a
; different compiler than the one that produced it. 7.0.1 is the version the
; README and CLAUDE.md build figures were measured on: Arduino core
; framework-arduinoespressif32 @ 3.20017.241212 and toolchain-xtensa-esp32 @
; 8.4.0+2021r2-patch5. Upgrading is a deliberate commit that re-measures those
; figures, not something that happens to whoever builds next.
platform = platformio/espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
board_build.partitions = huge_app.csv
; Stamps the branch and commit into the firmware so a board can say which build
; it is carrying -- BRAINO_VERSION cannot, being the same across every flash of
; a release. Here rather than per-env so no environment can be built unstamped.
; The script explains why the build time is NOT injected from here.
extra_scripts = pre:tools/build_stamp.py

[esp32s3_common]
; The ESP32-S3 side of the target. A separate section from [esp32_common]
; because `board` names a chip, not a family: an image built for `esp32dev` is
; Xtensa ESP32 and carries a chip ID that esptool refuses to write to an S3.
; Nothing in this repository could be flashed to an S3 board before this
; existed -- there was no "try the existing firmware and see" option.
;
; Measured off the Freenove FNK0104B on the bench, not read off a listing:
; ESP32-S3 (QFN56) rev v0.2, 16 MB quad flash, 8 MB embedded octal PSRAM
; (AP_3v3), USB-Serial/JTAG. That combination is the N16R8 module, and
; `memory_type = qio_opi` is how the Arduino core is told about it -- get it
; wrong and the board boots, runs, and fails at the first PSRAM access.
platform = platformio/espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 921600
board_build.partitions = huge_app.csv
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
extra_scripts = pre:tools/build_stamp.py

; ---------------------------------------------------------------------------
; Boards. One section per supported board, and it holds ONLY what that board
; makes true: its name, the header describing its pins, and the TFT_eSPI macros
; the display driver insists on being told at compile time.
;
; Everything else about the board -- touch pins, SD pins, the LED, the battery
; divider, which rotation is landscape -- lives in include/boards/<id>.h, and
; BoardConfig.h static_asserts the two descriptions against each other so a
; panel size or a backlight pin cannot be right in one place and wrong in the
; other. docs/PORTING.md is the checklist for adding a section here.
; ---------------------------------------------------------------------------

[board_e32r28t1]
build_flags =
    -D BOARD_NAME=\"E32R28T-1\"
    -D GUME_BOARD_HEADER=\"boards/e32r28t1.h\"
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000

[board_esp32_2432s028r]
; Original/classic CYD with ILI9341 and micro-USB connector
build_flags =
    -D BOARD_NAME=\"ESP32-2432S028R\"
    -D GUME_BOARD_HEADER=\"boards/esp32-2432s028r.h\"
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000

[board_esp32_2432s028_st7789]
; Newer CYD variants (Rv3, dual-USB) with ST7789 display
build_flags =
    -D BOARD_NAME=\"ESP32-2432S028Rv3\"
    -D GUME_BOARD_HEADER=\"boards/esp32-2432s028.h\"
    -D ST7789_DRIVER=1
    -D TFT_INVERT_COLORS=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000

[board_fnk0104b]
; Freenove FNK0104B, 2.8-inch ESP32-S3 with ILI9341 and FT6336U capacitive
; touch. Values cross-checked on the hardware with env:s3diag, not merely
; transcribed: BGR and INVERSION_ON are both correct here, which is an unusual
; pair and was read off the panel rather than assumed.
build_flags =
    -D BOARD_NAME=\"Freenove-FNK0104B\"
    -D GUME_BOARD_HEADER=\"boards/fnk0104b.h\"
    -D ILI9341_2_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=46
    -D TFT_RST=-1
    -D TFT_BL=45
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000

[board_e32r40t]
; LCDWIKI E32R40T -- the 4-inch board. Same reference PCB family as the
; E32R28T-1 above and the same display bus, with a bigger ST7796 panel: the
; ONLY pin that differs is the backlight, and that one difference is the trap.
; GPIO21 lights the 2.8-inch board and was measured dark here; 27 is correct
; and was measured, not assumed. BoardConfig.h static_asserts TFT_BL against
; the profile, so the two cannot drift apart again.
build_flags =
    -D BOARD_NAME=\"E32R40T\"
    -D GUME_BOARD_HEADER=\"boards/e32r40t.h\"
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000
    ; Touch shares the display bus with its own CS, so TFT_eSPI's built-in
    ; touch extension drives it -- TOUCH_CS is what activates that, and
    ; BoardTouch.cpp switches to it rather than bit-banging pins the display
    ; driver owns.
    -D TOUCH_CS=33
    -D SPI_TOUCH_FREQUENCY=2500000

[env:app]
; The console, on the 2.8-inch board. A second board is a second stanza of
; exactly this shape with a different ${board_*.build_flags}.
extends = esp32_common
build_src_filter = +<*> -<wifi_diag.cpp> -<battery_diag.cpp> -<s3_diag.cpp> -<diag4.cpp> -<audiodiag.cpp>
lib_deps = ${common.lib_deps}
lib_ldf_mode = deep+
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    ${board_e32r28t1.build_flags}

[env:bringup]
extends = esp32_common
build_src_filter = +<*> -<wifi_diag.cpp> -<battery_diag.cpp> -<s3_diag.cpp> -<diag4.cpp> -<audiodiag.cpp>
lib_deps = ${common.lib_deps}
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    ${board_e32r28t1.build_flags}
    -D CYD_BRINGUP_ONLY

[env:batdiag]
; Isolated battery bring-up and calibration tool: builds src/battery_diag.cpp
; ALONE, so no frame budget, watchdog, telemetry cache or UI can shape what the
; ADC appears to be doing. Needs TFT_eSPI for its readout, and nothing else.
;
; Eight pages, cycled with the BOOT key or 'n' over serial: LIVE (the multimeter
; comparison), NOISE (how much the raw ADC actually moves), FILTERS (raw vs EMA,
; and whether the badge would flicker), SOC (curve vs naive linear), CHARGE
; (plug/unplug scenario against the shipping inference), NO-BATT (resolves
; V_NO_BATTERY, which is the one threshold the vendor manual does not give),
; CALIBRATE (read the true divider ratio off against a meter) and LOG (CSV
; capture of a full discharge).
extends = esp32_common
build_src_filter = +<battery_diag.cpp>
lib_deps = bodmer/TFT_eSPI@2.5.43
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    ${board_e32r28t1.build_flags}
    -D CYD_BATTERY_DIAG

[env:wifidiag]
; Isolated Wi-Fi radio test: builds src/wifi_diag.cpp ALONE, so the TFT, touch,
; SD and game code cannot interfere. Flash it, open the serial monitor, and the
; scan result tells us whether the fault is software or RF. It touches no board
; peripheral, so it needs no board section.
extends = esp32_common
build_src_filter = +<wifi_diag.cpp>
build_flags =
    -D CYD_WIFI_DIAG

[env:app_esp32_2432s028r]
; The console on the ESP32-2432S028R (original/classic CYD with ILI9341).
extends = esp32_common
build_src_filter = +<*> -<wifi_diag.cpp> -<battery_diag.cpp> -<s3_diag.cpp> -<diag4.cpp> -<audiodiag.cpp>
lib_deps = ${common.lib_deps}
lib_ldf_mode = deep+
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    ${board_esp32_2432s028r.build_flags}

[env:bringup_esp32_2432s028r]
extends = esp32_common
build_src_filter = +<*> -<wifi_diag.cpp> -<battery_diag.cpp> -<s3_diag.cpp> -<diag4.cpp> -<audiodiag.cpp>
lib_deps = ${common.lib_deps}
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    ${board_esp32_2432s028r.build_flags}
    -D CYD_BRINGUP_ONLY

[env:batdiag_esp32_2432s028r]
extends = esp32_common
build_src_filter = +<battery_diag.cpp>
lib_deps = bodmer/TFT_eSPI@2.5.43
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    ${board_esp32_2432s028r.build_flags}
    -D CYD_BATTERY_DIAG

[env:app_esp32_2432s028_st7789]
; The console on the ESP32-2432S028 with ST7789 (Rv3/dual-USB variants).
extends = esp32_common
build_src_filter = +<*> -<wifi_diag.cpp> -<battery_diag.cpp> -<s3_diag.cpp> -<diag4.cpp> -<audiodiag.cpp>
lib_deps = ${common.lib_deps}
lib_ldf_mode = deep+
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    ${board_esp32_2432s028_st7789.build_flags}

[env:bringup_esp32_2432s028_st7789]
extends = esp32_common
build_src_filter = +<*> -<wifi_diag.cpp> -<battery_diag.cpp> -<s3_diag.cpp> -<diag4.cpp> -<audiodiag.cpp>
lib_deps = ${common.lib_deps}
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    ${board_esp32_2432s028_st7789.build_flags}
    -D CYD_BRINGUP_ONLY

[env:batdiag_esp32_2432s028_st7789]
extends = esp32_common
build_src_filter = +<battery_diag.cpp>
lib_deps = bodmer/TFT_eSPI@2.5.43
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    ${board_esp32_2432s028_st7789.build_flags}
    -D CYD_BATTERY_DIAG

[env:s3diag]
; Bring-up probe for the Freenove FNK0104B, built ALONE (src/s3_diag.cpp) in
; the same spirit as wifidiag and batdiag: no Board, no Ui, no watchdog, no
; frame budget, and -- the point -- no touch calibration wizard. env:bringup
; calls runTouchCalibration() on a board with no stored calibration, which on
; a capacitive panel the XPT2046 code cannot read means the first crosshair is
; a dead end with the display check stranded behind it.
;
; This environment deliberately has NO [board_*] section. A board section is a
; claim of support, and check_boards.py rightly enforces what that claim costs:
; a web-installer label, an offered firmware and a CI build. Braino cannot yet
; run on this board -- there is no capacitive touch path -- so making that
; claim now would advertise a firmware nobody can use. The section arrives when
; the port does; until then this is a probe, and `s3diag` is listed in
; check_boards.py's BOARDLESS_ENVS.
;
; The pin values below are transcribed from Freenove's own TFT_eSPI setup,
; Libraries/FNK0104AB/TFT_eSPI_Setups_v1.3.zip ->
; FNK0104AB_2.8_240x320_ILI9341.h. They are the vendor's claim, and confirming
; them against the hardware is this environment's whole job.
;
; ARDUINO_USB_CDC_ON_BOOT is not optional here. This board has no USB-UART
; bridge -- the port is the S3's own USB-Serial/JTAG -- so without it Serial
; goes to the UART0 pins and the probe reports its findings to nobody.
extends = esp32s3_common
build_src_filter = +<s3_diag.cpp>
lib_deps = bodmer/TFT_eSPI@2.5.43
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    -D GUME_S3_DIAG
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ILI9341_2_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=46
    -D TFT_RST=-1
    -D TFT_BL=45
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000

[env:app_e32r40t]
; The console on the 4-inch E32R40T. This board has no SD slot, LED, speaker
; or battery sense the firmware will use -- not because it lacks them, but
; because nobody has measured them yet (see include/boards/e32r40t.h); all four
; degrade rather than fail. Its reason to exist is the panel: 480x320 is a
; physically bigger, plainer screen for players who need one, and playable
; games reach it through Ui::ScaledRenderer.
extends = esp32_common
build_src_filter = +<*> -<wifi_diag.cpp> -<battery_diag.cpp> -<s3_diag.cpp> -<diag4.cpp> -<audiodiag.cpp>
lib_deps = ${common.lib_deps}
lib_ldf_mode = deep+
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    ${board_e32r40t.build_flags}

[env:diag4]
; Bring-up probe for the 4-inch ST7796 CYD board, built ALONE (src/diag4.cpp)
; in the same spirit as wifidiag, batdiag and s3diag. It exists because every
; fact that board needs stated in a profile header is currently a guess -- the
; abandoned feat/st7796-4inch-board branch says so in its own comments, calling
; the display SPI pins an "unverified guess" and the backlight pin a value it
; was "trying next" -- and all three ways of being wrong (bus, driver,
; backlight) produce the identical symptom of a dark screen with a healthy
; serial log.
;
; Like s3diag, this deliberately has NO [board_*] section. A board section is a
; claim of support, and check_boards.py enforces what that claim costs: a
; web-installer label, an offered firmware and a CI build. Braino cannot run on
; this board yet -- nothing about it is confirmed -- so the section arrives with
; the port. Until then this is a probe, and `diag4` is in BOARDLESS_ENVS.
;
; Two omissions below are load-bearing, not oversights:
;
;   TFT_BL is NOT defined. If TFT_eSPI owned the backlight it would drive the
;   one pin already under suspicion, and the sweep on page BL could not test
;   the alternatives. diag4.cpp drives candidates itself, as plain GPIO.
;
;   GUME_BOARD_HEADER is NOT defined, so this never includes BoardConfig.h.
;   There is no profile for this board; producing the numbers that go in one is
;   the whole job. A probe must not depend on the answer it exists to find.
;
; The panel pins below are the branch's guesses, carried over verbatim so the
; probe tests the actual claim rather than a tidied-up version of it. Page ID
; reads the controller's ID register back over MISO, which is what tells you
; whether they are right at all.
extends = esp32_common
build_src_filter = +<diag4.cpp>
; NimBLE as well as the panel driver, because page RADIO tests Wi-Fi and BLE
; together and coexistence is a property of the host stack -- proving it with
; Bluedroid would prove nothing about what Braino actually ships.
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    h2zero/NimBLE-Arduino@^1.4.2
lib_ldf_mode = deep+
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    -D GUME_DIAG4
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D USE_HSPI_PORT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000
    ; Activates TFT_eSPI's own touch extension, which is what page TOUCH-S
    ; tests: the claim that this board's XPT2046 shares the display bus rather
    ; than having its own. Page TOUCH-B tests the opposite wiring on plain
    ; GPIO, so the two can be told apart by measurement.
    -D TOUCH_CS=33
    -D SPI_TOUCH_FREQUENCY=2500000

[env:app_fnk0104b]
; The console on the Freenove FNK0104B. This board has no SD slot the firmware
; can use and no LED it can drive (see include/boards/fnk0104b.h); both degrade
; quietly, which is what PIN_NONE is for.
extends = esp32s3_common
build_src_filter = +<*> -<wifi_diag.cpp> -<battery_diag.cpp> -<s3_diag.cpp> -<diag4.cpp> -<audiodiag.cpp>
lib_deps = ${common.lib_deps}
lib_ldf_mode = deep+
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    ${board_fnk0104b.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:audiodiag]
; Standalone DAC audio bring-up probe: builds src/audiodiag.cpp ALONE so
; no frame budget, watchdog or game code can interfere with the audio path.
;
; Targets the E32R28T-1 (2.8-inch CYD) because that is the first DAC-audio
; board and the one with hardware available for measurement. Flash it, open
; the serial monitor, and step through pages with the BOOT button:
;
;   SINE   -- continuous sine wave at the configured frequency; adjust to
;             verify the speaker makes sound and to find the distortion
;             threshold that set maxVolume = 75.
;   SWEEP  -- slow frequency sweep across the audible range so you can hear
;             the speaker's frequency response and confirm no blind spots.
;   CUES   -- each Sound:: cue from the shared vocabulary, in order. The
;             synthesiser is the same code the app uses; if a cue sounds
;             right here it will sound right in the app.
;   BOOT   -- the spoken "Let's play Braino!" boot phrase, looped. The
;             hardest case: it is the longest script and the one that
;             exposes DMA underruns as stutter.
;   VOLUME -- steps through 0-100% in 10% increments, one per press, so
;             you can confirm the curve is audibly monotonic.
;
; Like batdiag, this deliberately has NO [board_*] section: it is
; explicitly listed in BOARDLESS_ENVS in check_boards.py. Audio must be
; validated on hardware before a board section would be appropriate; the
; section arrives with a confirmed measurement, not before.
extends = esp32_common
build_src_filter = +<audiodiag.cpp>
lib_deps = bodmer/TFT_eSPI@2.5.43
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    ${board_e32r28t1.build_flags}
    -D CYD_AUDIO_DIAG
