[platformio]
default_envs = app

[common]
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.4
    file://C:/Users/Ankus/CppEsp32Lib
    ; NimBLE rather than the core's Bluedroid stack: advertise-only needs a
    ; fraction of the host, and flash is the scarce resource on huge_app.
    h2zero/NimBLE-Arduino@^1.4.2
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -D BOARD_NAME=\"E32R28T-1\"
    ; 3 = landscape with the USB edge at the bottom (1 is the same view
    ; rotated 180). pollTouch() already compensates for every rotation.
    -D CYD_SCREEN_ROTATION=3
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000
    -D SUPPORT_TRANSACTIONS
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
    -D DISABLE_ALL_LIBRARY_WARNINGS=1

[env:app]
build_src_filter = +<*> -<wifi_diag.cpp>
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
board_build.partitions = huge_app.csv
lib_deps = ${common.lib_deps}
lib_ldf_mode = deep+
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags}

[env:bringup]
build_src_filter = +<*> -<wifi_diag.cpp>
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
board_build.partitions = huge_app.csv
lib_deps = ${common.lib_deps}
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    -D CYD_BRINGUP_ONLY

[env:wifidiag]
; Isolated Wi-Fi radio test: builds src/wifi_diag.cpp ALONE, so the TFT, touch,
; SD and game code cannot interfere. Flash it, open the serial monitor, and the
; scan result tells us whether the fault is software or RF.
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv
build_src_filter = +<wifi_diag.cpp>
build_flags =
    -D CYD_WIFI_DIAG
