    -D CYD_BATTERY_DIAG

[env:audiodiag_e32r32p]
; The amplifier on this board is enabled by IO4 (active low) and fed from the
; DAC on IO26. Both are vendor-documented; neither has been heard yet. This is
; the env that settles it, and maxVolume in the profile is the number it exists
; to produce.
extends = esp32_common
build_src_filter = +<audiodiag.cpp>
lib_deps = bodmer/TFT_eSPI@2.5.43
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    ${board_e32r32p.build_flags}
    -D CYD_AUDIO_DIAG
