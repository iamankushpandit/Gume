[platformio]
default_envs = app

[common]
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.4
    https://github.com/iamankushpandit/map-n-flag.git
    ; NimBLE rather than the core's Bluedroid stack: advertise-only needs a
    ; fraction of the host, and flash is the scarce resource on huge_app.
    h2zero/NimBLE-Arduino@^1.4.2
build_unflags =
    -std=gnu++11
; Everything here is true of every CYD board this firmware runs on. What
; differs between them lives in a [panel_*] section below -- see the panel
; matrix in CLAUDE.md before adding one.
build_flags =
    -std=gnu++17
    -Wall
    ; 3 = landscape with the USB edge at the bottom (1 is the same view
    ; rotated 180). pollTouch() already compensates for every rotation.
    -D CYD_SCREEN_ROTATION=3
    -D USER_SETUP_LOADED=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000
    -D SUPPORT_TRANSACTIONS
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
    -D DISABLE_ALL_LIBRARY_WARNINGS=1

; ---------------------------------------------------------------------------
; Panels
;
; The 2.8-inch CYD (ESP32-2432S028R) shipped with two different controllers on
; an otherwise identical board: the early single-USB units are ILI9341, and the
; later two-USB units (often called v2/v3, or CYD2USB) are ST7789 with the
; colour order swapped and inversion off. Every GPIO is the same, which is why
; this is a flag change and not a second pin map.
;
; Wrong panel flags do not fail to boot -- they show inverted or blue-tinted
; colours, or nothing at all. That is what the bringup build is for.
;
; The 2.4-inch ESP32-2432S024R is deliberately absent: its touch controller
; shares the display SPI bus, its backlight is on GPIO27, and GPIO34 is a light
; sensor rather than a battery divider. Board::pollTouch() bit-bangs dedicated
; touch pins, so that board needs driver work, not a flag.
; ---------------------------------------------------------------------------

[panel_ili9341]
build_flags =
    -D BOARD_NAME=\"E32R28T-1\"
    -D ILI9341_2_DRIVER=1

[panel_st7789]
build_flags =
    -D BOARD_NAME=\"CYD2USB\"
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_OFF

[env_base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
board_build.partitions = huge_app.csv
build_src_filter = +<*> -<wifi_diag.cpp>
lib_deps = ${common.lib_deps}
lib_ldf_mode = deep+
build_unflags = ${common.build_unflags}

; --- The console -----------------------------------------------------------

[env:app]
extends = env_base
build_flags = ${common.build_flags} ${panel_ili9341.build_flags}

[env:app_st7789]
extends = env_base
build_flags = ${common.build_flags} ${panel_st7789.build_flags}

; --- Display and touch bring-up, per panel ---------------------------------

[env:bringup]
extends = env_base
build_flags =
    ${common.build_flags}
    ${panel_ili9341.build_flags}
    -D CYD_BRINGUP_ONLY

[env:bringup_st7789]
extends = env_base
build_flags =
    ${common.build_flags}
    ${panel_st7789.build_flags}
    -D CYD_BRINGUP_ONLY

; --- Radio ------------------------------------------------------------------

[env:wifidiag]
; Isolated Wi-Fi radio test: builds src/wifi_diag.cpp ALONE, so the TFT, touch,
; SD and game code cannot interfere. Flash it, open the serial monitor, and the
; scan result tells us whether the fault is software or RF. No display code, so
; one build serves every panel.
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv
build_src_filter = +<wifi_diag.cpp>
build_flags =
    -D CYD_WIFI_DIAG
