[platformio]
default_envs = app

[common]
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.4
    https://github.com/iamankushpandit/map-n-flag.git
    ; NimBLE rather than the core's Bluedroid stack: advertise-only needs a
    ; fraction of the host, and flash is the scarce resource on huge_app.
    h2zero/NimBLE-Arduino@^1.4.2
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -D BOARD_NAME=\"E32R28T-1\"
    ; 3 = landscape with the USB edge at the bottom (1 is the same view
    ; rotated 180). pollTouch() already compensates for every rotation.
    -D CYD_SCREEN_ROTATION=3
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000
    -D SUPPORT_TRANSACTIONS
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
    -D DISABLE_ALL_LIBRARY_WARNINGS=1

[env:app]
build_src_filter = +<*> -<wifi_diag.cpp>
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
board_build.partitions = huge_app.csv
lib_deps = ${common.lib_deps}
lib_ldf_mode = deep+
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags}

[env:bringup]
build_src_filter = +<*> -<wifi_diag.cpp>
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
board_build.partitions = huge_app.csv
lib_deps = ${common.lib_deps}
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    -D CYD_BRINGUP_ONLY

[env:wifidiag]
; Isolated Wi-Fi radio test: builds src/wifi_diag.cpp ALONE, so the TFT, touch,
; SD and game code cannot interfere. Flash it, open the serial monitor, and the
; scan result tells us whether the fault is software or RF.
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv
build_src_filter = +<wifi_diag.cpp>
build_flags =
    -D CYD_WIFI_DIAG

; The 4-inch ST7796S board (320x480), as opposed to env:app's 2.8-inch
; ILI9341 (240x320). Same SPI pins, but five things genuinely differ and all
; five matter: the driver, the resolution, the backlight GPIO (27 not 21 --
; this is what leaves the panel dark while the rest of the firmware runs),
; the 27MHz bus, and no HSPI remap.
[env:app4]
build_src_filter = +<*> -<wifi_diag.cpp>
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
board_build.partitions = huge_app.csv
lib_deps = ${common.lib_deps}
lib_ldf_mode = deep+
build_unflags =
    ${common.build_unflags}
    -D BOARD_NAME=\"E32R28T-1\"
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=21
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000
build_flags =
    ${common.build_flags}
    -D BOARD_NAME=\"ESP32-4inch-ST7796S\"
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_BL=27
    ; 40MHz, verified on the 4-inch board: clean panel, working touch, no
    ; watchdog resets over a 60s soak. This started at a conservative 27MHz
    ; picked without testing; feat/st7796-4inch-board inherits the common
    ; 40MHz and was right to. Drop it back if a different ST7796S unit tears.
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    ; USE_HSPI_PORT is inherited from [common] and must stay. Pins 12/13/14/15
    ; are the HSPI defaults, and this firmware also drives an SD card on VSPI
    ; (5/23/18/19). Dropping the flag -- as a bare vendor example without an SD
    ; card happily does -- puts the panel and the digitiser on VSPI too, and SD
    ; init then reconfigures the bus out from under them. Touch dies and the
    ; panel misbehaves, with nothing pointing at the SD card.
    ; The XPT2046 shares the LCD's SPI bus on this board rather than having
    ; its own three pins, and the RGB LED lines differ too.
    -D PIN_TOUCH_SCLK_CFG=14
    -D PIN_TOUCH_MOSI_CFG=13
    -D PIN_TOUCH_MISO_CFG=12
    -D PIN_RGB_R_CFG=22
    -D PIN_RGB_G_CFG=16
    -D PIN_RGB_B_CFG=17
    ; The digitiser shares the LCD's SPI pins here, so it must be read through
    ; TFT_eSPI's peripheral rather than bit-banged. TOUCH_CS compiles that
    ; support in; TOUCH_SHARES_LCD_BUS selects it in Board::readRawTouch().
    -D TOUCH_CS=33
    -D TOUCH_SHARES_LCD_BUS=1
    ; 1.3x the 2.8-inch icon. Tiles here are 228x73 rather than 145x46, and the
    ; 18px icon looks lost in one.
    -D LAUNCHER_ICON_HALF=24
    ; This board'''s smallest tile: 480x320 landscape, header 48 and footer 36
    ; leave a 236px band, three rows on 8px gaps gives 73. The icon assert is
    ; checked against this rather than the 2.8-inch board'''s 46.
    -D LAUNCHER_MIN_TILE_H=73

